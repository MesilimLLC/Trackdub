[project]
name = "trackdub-gpu-docs-mcp"
version = "0.1.0"
description = "Local FastMCP over Trackdub GPU / TensorRT-RTX curated docs (v0 keyword RAG)."
readme = "README.md"
requires-python = ">=3.11.5"
dependencies = [
  "fastmcp>=2.3.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  # Dependabot floor: GHSA-mmhr-3c5m-f64f and earlier soupsieve advisories.
  "soupsieve>=4.0.0",
  "lxml>=5.0.0",
]

[project.scripts]
trackdub-gpu-docs-mcp = "trackdub_gpu_docs_mcp.server:main"
trackdub-gpu-docs-ingest = "trackdub_gpu_docs_mcp.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trackdub_gpu_docs_mcp"]

[tool.uv]
package = true
