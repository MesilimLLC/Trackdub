name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.editorconfig'
  # Every pull request, not only the ones targeting main. A stacked pull request (base = another
  # branch) is still merged code, and with the branch filter above it in place the matrix never ran
  # for it: the run had to be dispatched by hand, and the change only met the matrix once it landed
  # on main. Pull requests into main are unaffected; the concurrency group below already keys on the
  # pull request number.
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  format:
    name: Verify Code Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        # actions/setup-dotnet's install script defaults to a system-wide
        # location (e.g. C:\Program Files\dotnet) that self-hosted runner
        # service accounts often can't write to. Redirect installs into the
        # per-step runner temp directory, which is always writable
        # regardless of runner OS or account. (The `runner` context is
        # only available inside a step, not at the job- or workflow-level
        # `env:` -- confirmed via GitHub's own workflow validation error.)
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: '11.0.100'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            NuGet.config

      - name: Restore Dependencies
        shell: bash
        run: dotnet restore Trackdub.slnx -m:1

      - name: Verify Format Style Limits
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          else
            base_sha="$(git rev-parse HEAD^)"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            echo "No base commit available; verifying the full solution."
            dotnet format Trackdub.slnx --verify-no-changes
            exit $?
          fi

          mapfile -t changed_cs_files < <(
            git diff --name-only --diff-filter=ACMR "$base_sha"...HEAD -- '*.cs'
          )

          if (( ${#changed_cs_files[@]} == 0 )); then
            echo "No changed C# files to format."
            exit 0
          fi

          printf 'Verifying format for %s changed C# file(s).\n' "${#changed_cs_files[@]}"
          dotnet format Trackdub.slnx --verify-no-changes --include "${changed_cs_files[@]}"

  repository-boundary:
    name: Verify Repository Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Scan for stale license/desktop-boundary claims
        shell: bash
        run: python3 scripts/ci/check-repository-boundary.py

  audit-mirrors:
    name: Verify Audit Mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify the concatenated dead-code audit matches its standalone copies
        shell: bash
        run: python3 scripts/ci/check-audit-mirrors.py

  controlled-matrix-cpu-budget:
    name: Controlled Matrix CPU Budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: '11.0.100'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            NuGet.config

      - name: Restore Dependencies
        run: dotnet restore Trackdub.slnx -m:1

      - name: Build Benchmark Host
        run: dotnet build src/Trackdub.Benchmarks.DevHost -c Release --no-restore -f net11.0 -m:1

      - name: Enforce Controlled-Matrix CPU Budget
        run: python3 scripts/ci/check_controlled_matrix_cpu_budget.py

  build-windows:
    name: Build & Test (Windows)
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: '11.0.100'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            NuGet.config

      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Restore Dependencies
        shell: bash
        run: dotnet restore Trackdub.slnx -m:1

      - name: Compile
        shell: bash
        run: dotnet build Trackdub.slnx -c Release --no-restore -m:1

      - name: Test
        shell: bash
        run: bash scripts/ci/dotnet-test-with-retry.sh test Trackdub.slnx -c Release --no-build -m:1

  build-linux:
    name: Build & Test (Linux)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: '11.0.100'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            NuGet.config

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Restore Dependencies
        shell: bash
        run: dotnet restore Trackdub.slnx -m:1

      - name: Compile
        shell: bash
        run: dotnet build Trackdub.slnx -c Release --no-restore -m:1

      - name: Test
        shell: bash
        run: dotnet test Trackdub.slnx -c Release --no-build -m:1

  build-macos:
    name: Build & Test (macOS)
    timeout-minutes: 25
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: '11.0.100'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            NuGet.config

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Restore Dependencies
        shell: bash
        run: dotnet restore Trackdub.slnx -m:1

      - name: Compile
        shell: bash
        run: dotnet build Trackdub.slnx -c Release --no-restore -m:1

      - name: Test
        shell: bash
        run: dotnet test Trackdub.slnx -c Release --no-build -m:1
