name: CodeScene PR Refactoring Agent

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to refactor
        required: true
        type: number
  issue_comment:
    types: [created]

permissions: {}

jobs:
  refactor:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/cs-agent') &&
      (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) ||
       github.event.comment.user.login == 'codescene-access[bot]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Run CodeScene refactoring agent
        uses: MesilimLLC/pr-refactoring-agent@61e04f98be3b66197686dfba84f9c6ebea2f7862 # v1.1.10 with Meta Model API support
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        with:
          pr_number: ${{ inputs.pr_number || github.event.issue.number }}
          command: ${{ (github.event_name == 'workflow_dispatch' || github.event.comment.body == '/cs-agent') && '/cs-agent skill:fix-code-health-degradations' || github.event.comment.body }}
          model: ${{ vars.CODESCENE_AGENT_MODEL || 'model_api/muse-ember-1.0' }}
          codescene_token: ${{ secrets.CODESCENE_ACCESS_TOKEN }}



