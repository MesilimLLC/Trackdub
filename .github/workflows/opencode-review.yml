---
name: OpenCode review
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: opencode-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    uses: tonythethompson/opencode-review-threads/.github/workflows/opencode-review.yml@v1
    with:
      models-review: meta:muse-spark-1.3
      models-fix: meta:muse-ember-1.0
    secrets:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
