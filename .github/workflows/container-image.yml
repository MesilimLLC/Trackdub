name: Container Image

on:
  push:
    branches: [main]
    tags: ['container-v*']
    paths:
      - '.dockerignore'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.aws.yml'
      - 'docker/**'
      - 'scripts/docker/**'
      - 'src/**'
      - 'build/**'
      - 'runtime/**'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'NuGet.config'
      - 'global.json'
      - 'BannedSymbols.txt'
      - '.github/workflows/container-image.yml'
  pull_request:
    paths:
      - '.dockerignore'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.aws.yml'
      - 'docker/**'
      - 'scripts/docker/**'
      - 'src/**'
      - 'build/**'
      - 'runtime/**'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'NuGet.config'
      - 'global.json'
      - 'BannedSymbols.txt'
      - '.github/workflows/container-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build, verify, and publish Linux GPU image (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [rtx, server]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/mesililm-llc/trackdub
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-${{ matrix.profile }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Capture previous latest image size
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          baseline=0
          if docker pull "$IMAGE_NAME:latest-${{ matrix.profile }}" >/dev/null 2>&1; then
            baseline="$(docker image inspect "$IMAGE_NAME:latest-${{ matrix.profile }}" --format '{{.Size}}')"
          fi
          printf '%s\n' "$baseline" > "image-size-baseline-${{ matrix.profile }}.txt"

      - name: Build and publish (main / container tags); load on PR for verification
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.profile }}
          platforms: linux/amd64
          tags: ${{ github.event_name == 'pull_request' && format('trackdub-ci:{0}', matrix.profile) || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          cache-from: type=gha,scope=trackdub-linux-amd64-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=trackdub-linux-amd64-${{ matrix.profile }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Pull the just-published commit image
        if: github.event_name != 'pull_request'
        run: docker pull "$IMAGE_NAME:sha-${GITHUB_SHA}-${{ matrix.profile }}"

      - name: Record image size and compare with latest
        shell: bash
        env:
          IMAGE_REF: ${{ github.event_name == 'pull_request' && format('trackdub-ci:{0}', matrix.profile) || format('{0}:sha-{1}-{2}', env.IMAGE_NAME, github.sha, matrix.profile) }}
        run: |
          set -euo pipefail
          current_bytes="$(docker image inspect "$IMAGE_REF" --format '{{.Size}}')"
          baseline_bytes=0
          if [[ -f "image-size-baseline-${{ matrix.profile }}.txt" ]]; then
            baseline_bytes="$(<"image-size-baseline-${{ matrix.profile }}.txt")"
          fi
          python3 - "$current_bytes" "$baseline_bytes" "$GITHUB_STEP_SUMMARY" "$GITHUB_WORKSPACE" "${{ matrix.profile }}" <<'PY'
          import json
          import pathlib
          import sys
          from datetime import datetime, timezone

          current, baseline = map(int, sys.argv[1:3])
          summary, workspace, profile = sys.argv[3:]
          delta = current - baseline if baseline else None
          result = {
              "profile": profile,
              "commit": "${{ github.sha }}",
              "image_bytes": current,
              "image_mib": round(current / 1024 / 1024, 2),
              "baseline_bytes": baseline or None,
              "delta_bytes": delta,
              "recorded_at": datetime.now(timezone.utc).isoformat(),
          }
          record = pathlib.Path(workspace) / f"image-size-{profile}.json"
          record.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          with open(summary, "a", encoding="utf-8") as output:
              output.write(f"### {profile} image size\n\n")
              output.write(f"- Current: {current / 1024 / 1024:.2f} MiB\n")
              if baseline:
                  output.write(f"- Previous latest: {baseline / 1024 / 1024:.2f} MiB\n")
                  output.write(f"- Change: {delta / 1024 / 1024:+.2f} MiB\n")
              else:
                  output.write("- Previous latest: unavailable (first build or PR build)\n")
              output.write(f"- Record: `{record.name}`\n")
          print(json.dumps(result, indent=2))
          PY

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ github.event_name == 'pull_request' && format('trackdub-ci:{0}', matrix.profile) || format('{0}:sha-{1}-{2}', env.IMAGE_NAME, github.sha, matrix.profile) }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload image size record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-size-${{ matrix.profile }}-${{ github.run_id }}
          path: image-size-${{ matrix.profile }}.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Verify image runtime and bundled tools
        env:
          IMAGE_REF: ${{ github.event_name == 'pull_request' && format('trackdub-ci:{0}', matrix.profile) || format('{0}:sha-{1}-{2}', env.IMAGE_NAME, github.sha, matrix.profile) }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm "$IMAGE_REF" doctor > doctor.json 2>doctor.stderr
          doctor_status=$?
          set -e
          cat doctor.json
          cat doctor.stderr >&2
          # An empty model volume is intentional in CI; doctor exits 2 because pipeline
          # models are not seeded. These image/runtime checks must nevertheless pass.
          test "$doctor_status" -eq 2
          jq -e '[.checks[] | select(.id == "bundled-manifest" and .status == "pass")] | length == 1' doctor.json
          jq -e '[.checks[] | select(.id == "ffmpeg-tools" and .status == "pass")] | length == 1' doctor.json
          jq -e '[.checks[] | select(.id == "espeak-ng" and .status == "pass")] | length == 1' doctor.json
          jq -e '[.checks[] | select(.id == "model-cache-writable" and .status == "pass")] | length == 1' doctor.json
          jq -e '[.checks[] | select(.id == "pipeline-readiness" and .status == "fail")] | length == 1' doctor.json

      - name: Verify image profile marker and base distribution
        env:
          IMAGE_REF: ${{ github.event_name == 'pull_request' && format('trackdub-ci:{0}', matrix.profile) || format('{0}:sha-{1}-{2}', env.IMAGE_NAME, github.sha, matrix.profile) }}
        shell: bash
        run: |
          set -euo pipefail
          profile="$(docker run --rm --entrypoint sh "$IMAGE_REF" -c 'printf %s "$TRACKDUB_GPU_PROFILE"')"
          test "$profile" = "${{ matrix.profile }}"
          docker run --rm --entrypoint sh "$IMAGE_REF" -c '
            grep -q "^ID=ubuntu$" /etc/os-release
            grep -q "^VERSION_ID=\"24.04\"$" /etc/os-release
          '

      - name: Verify server image contract
        if: matrix.profile == 'server'
        env:
          IMAGE_REF: ${{ github.event_name == 'pull_request' && format('trackdub-ci:{0}', matrix.profile) || format('{0}:sha-{1}-{2}', env.IMAGE_NAME, github.sha, matrix.profile) }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$IMAGE_REF" -c '
            set -e
            test -x /usr/bin/setsid
            for soname in libnvinfer.so.10 libnvinfer_plugin.so.10 libnvonnxparser.so.10 libcudnn.so.9 libcudart.so.13; do
              ldconfig -p | grep -q "$soname"
            done
            for lib in libonnxruntime.so libonnxruntime-genai.so libonnxruntime_providers_cuda.so libonnxruntime_providers_tensorrt.so; do
              test -f "/app/$lib"
            done
            if ldd /app/libonnxruntime_providers_tensorrt.so | grep -q "not found"; then exit 1; fi
            if ldd /app/libonnxruntime.so | grep -q "not found"; then exit 1; fi
            if ldd /app/libonnxruntime-genai.so | grep -q "not found"; then exit 1; fi
            if ldd /app/libonnxruntime_providers_cuda.so | grep "not found" | grep -v "libcuda.so.1" | grep -q .; then exit 1; fi
            dotnet /app/Trackdub.Cli.dll run pipeline --help > /tmp/trackdub-machine-help.txt
            grep -F -- "--result-file" /tmp/trackdub-machine-help.txt
            grep -F -- "--progress-file" /tmp/trackdub-machine-help.txt
          '

      - name: Record published digest
        if: github.event_name != 'pull_request'
        run: echo "Published $IMAGE_NAME:sha-${GITHUB_SHA}-${{ matrix.profile }} (${{ steps.build.outputs.digest }})" >> "$GITHUB_STEP_SUMMARY"
