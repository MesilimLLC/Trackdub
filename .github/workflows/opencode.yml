---
name: OpenCode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        required: true
        type: string
        description: Prompt for OpenCode

concurrency:
  group: opencode-bot-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  opencode:
    if: >-
      !endsWith(github.actor, '[bot]')
      && (github.event_name == 'workflow_dispatch'
          || (github.event.comment && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    uses: tonythethompson/opencode-review-threads/.github/workflows/opencode-bot.yml@v1
    with:
      prompt: ${{ inputs.prompt }}
      models-review: meta:muse-spark-1.3
      models-fix: meta:muse-ember-1.0
    secrets:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
