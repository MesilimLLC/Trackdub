name: TRT RTX Smoke

on:
  workflow_dispatch:

concurrency:
  group: trt-rtx-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trt-rtx-smoke:
    name: TensorRT RTX benchmark smoke
    if: vars.TRACKDUB_TRT_RTX_SMOKE == 'true'
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
      DOTNET_ROOT: ${{ github.workspace }}/.dotnet
      TRACKDUB_TRT_RTX_SMOKE: '1'
      # Pin the model cache so the "Download starter-pack models" step and the
      # "Run TRT RTX provider smoke" step resolve the same directory. The CLI
      # (TrackdubStoragePaths) writes to TRACKDUB_CACHE_ROOT/model-cache; the
      # benchmark (BenchmarkModelPathResolver) reads TRACKDUB_MODEL_CACHE. Keep
      # the two consistent (TRACKDUB_MODEL_CACHE == TRACKDUB_CACHE_ROOT/model-cache).
      TRACKDUB_CACHE_ROOT: ${{ github.workspace }}/.trackdub-cache
      TRACKDUB_MODEL_CACHE: ${{ github.workspace }}/.trackdub-cache/model-cache
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            NuGet.config

      - name: Restore Dependencies
        shell: pwsh
        run: dotnet restore Trackdub.slnx -m:1

      - name: Fetch TensorRT RTX EP ABI plugin
        shell: pwsh
        run: ./tools/dev/Fetch-TrtRtxEp.ps1

      - name: Export plugin directory
        shell: pwsh
        run: |
          # Derive from the pinned manifest so EP ABI bumps don't need a workflow edit.
          $manifest = Get-Content -Raw runtime/trt-rtx-ep.manifest.json | ConvertFrom-Json
          $package = $manifest.packages.'win-x64'
          $version = if ($package.PSObject.Properties.Name -contains 'version' -and $package.version) { $package.version } else { $manifest.version }
          $pluginDir = Join-Path $env:LOCALAPPDATA "Trackdub\Providers\trt-rtx\$version\$($manifest.cudaVariant)\win-x64"
          if (-not (Test-Path $pluginDir)) {
            throw "Expected plugin directory not found: $pluginDir"
          }
          "TRACKDUB_TRT_RTX_EP_DIR=$pluginDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Benchmarks
        shell: pwsh
        run: dotnet build src/Trackdub.Benchmarks.DevHost/Trackdub.Benchmarks.DevHost.csproj -f net11.0-windows10.0.19041.0 -m:1 --no-restore

      - name: Download starter-pack models
        shell: pwsh
        run: |
          # Source of truth: src/Trackdub.Composition/StarterPacks/TrtRtxSmokeCatalog.cs
          # -> TrtRtxSmokeCatalog.StarterPackTurboGpu. Keep this list and the variants
          # (gpu-int4, quantized, fp16) in sync with that catalog so BenchmarkModelPathResolver
          # can resolve every smoke target instead of skipping it.
          $targets = @(
            @{ Id = 'cgus/diar_streaming_sortformer_4spk-v2.1-onnx' },
            @{ Id = 'openai/whisper-small' },
            @{ Id = 'openai/whisper-medium' },
            @{ Id = 'tonythethompson/qwen3-asr-0.6b-onnx' },
            @{ Id = 'tonythethompson/qwen3-asr-1.7b-onnx' },
            @{ Id = 'microsoft/Phi-4-mini-instruct-onnx'; Variant = 'gpu-int4' },
            @{ Id = 'google/madlad400-3b-mt'; Variant = 'quantized' },
            @{ Id = 'ResembleAI/chatterbox-turbo-ONNX'; Variant = 'fp16' }
          )
          foreach ($target in $targets) {
            $variantArgs = if ($target.ContainsKey('Variant')) { @('--variant', $target.Variant) } else { @() }
            $label = if ($target.ContainsKey('Variant')) { "$($target.Id)@$($target.Variant)" } else { $target.Id }
            Write-Host "Downloading $label"
            dotnet run --project src/Trackdub.Cli -f net11.0-windows10.0.19041.0 --no-restore -- `
              models download $target.Id @variantArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Model download failed for $label (exit code $LASTEXITCODE)."
            }
          }

      - name: Run TRT RTX provider smoke
        shell: pwsh
        run: |
          dotnet run --project src/Trackdub.Benchmarks.DevHost -f net11.0-windows10.0.19041.0 --no-build -- `
            --scope trt-rtx-smoke `
            --provider trt-rtx `
            --runs 1 `
            --format console
