AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Trackdub cloud render POC network, bucket and instance role. Creates no compute.
  Launch GPU runs with deploy/aws/launch-run.sh. Deploy in us-east-1; the SnapSoft POC
  permission set is scoped to that region.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.77.0.0/16
    Description: CIDR for the POC VPC. Must not overlap networks you peer with.
  BucketName:
    Type: String
    Default: ""
    Description: >
      Optional S3 bucket name. Leave empty to use trackdub-poc-<stack>-<account>-<region>.
      Bucket names are global, so set this if the default is taken.
  TokenParameterName:
    Type: String
    Default: /trackdub/ghcr-read-token
    AllowedPattern: ^/[A-Za-z0-9_./-]+$
    Description: >
      SSM SecureString holding a GitHub token with read:packages. Create it yourself before
      launching a run; this stack only grants the instance role permission to read it.

Conditions:
  HasBucketName: !Not [!Equals [!Ref BucketName, ""]]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub trackdub-poc-${AWS::StackName}
        - Key: Project
          Value: trackdub-poc-e2e

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub trackdub-poc-${AWS::StackName}
        - Key: Project
          Value: trackdub-poc-e2e

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub trackdub-poc-${AWS::StackName}-public
        - Key: Project
          Value: trackdub-poc-e2e

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # Three subnets in three zones: a GPU shortage in one zone is common, and the launcher
  # retries the other subnets.
  Subnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!GetAtt Vpc.CidrBlock, 3, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub trackdub-poc-${AWS::StackName}-1
        - Key: Project
          Value: trackdub-poc-e2e

  Subnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!GetAtt Vpc.CidrBlock, 3, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub trackdub-poc-${AWS::StackName}-2
        - Key: Project
          Value: trackdub-poc-e2e

  Subnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!GetAtt Vpc.CidrBlock, 3, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub trackdub-poc-${AWS::StackName}-3
        - Key: Project
          Value: trackdub-poc-e2e

  Subnet1RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet1
      RouteTableId: !Ref PublicRouteTable

  Subnet2RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet2
      RouteTableId: !Ref PublicRouteTable

  Subnet3RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet3
      RouteTableId: !Ref PublicRouteTable

  # No inbound rules. Instances are managed through SSM Session Manager and only make outbound calls
  # (GHCR, Hugging Face, S3, SSM, the package mirrors).
  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub trackdub-poc-${AWS::StackName}
      GroupDescription: Trackdub POC GPU workers. No inbound access.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub trackdub-poc-${AWS::StackName}
        - Key: Project
          Value: trackdub-poc-e2e

  RunBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - HasBucketName
        - !Ref BucketName
        - !Sub trackdub-poc-${AWS::StackName}-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-run-outputs
            Status: Enabled
            Prefix: runs/
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: trackdub-poc-e2e

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub trackdub-poc-${AWS::StackName}-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: trackdub-poc-run
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RunBucketObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:aws:s3:::${RunBucket}/*
              - Sid: RunBucketList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${RunBucket}
              - Sid: ReadGhcrToken
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TokenParameterName}
      Tags:
        - Key: Project
          Value: trackdub-poc-e2e

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub trackdub-poc-${AWS::StackName}-instance
      Roles:
        - !Ref InstanceRole

Outputs:
  Region:
    Value: !Ref AWS::Region
  VpcId:
    Value: !Ref Vpc
  SubnetIds:
    Description: Comma-separated; the launcher tries them in order.
    Value: !Join [",", [!Ref Subnet1, !Ref Subnet2, !Ref Subnet3]]
  SecurityGroupId:
    Value: !Ref WorkerSecurityGroup
  BucketName:
    Value: !Ref RunBucket
  InstanceProfileName:
    Value: !Ref InstanceProfile
  TokenParameterName:
    Value: !Ref TokenParameterName
