[project]
name = "trackdub-pkg-resources-shim"
version = "1.0.0"
description = "Minimal importlib-based pkg_resources shim for resemble-perth (setuptools 81+ removed pkg_resources)."
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pkg_resources.py"]
