services:
  trackdub:
    build:
      context: .
      dockerfile: Dockerfile
      target: "${TRACKDUB_GPU_TARGET:-rtx}"
    env_file:
      - path: .env
        required: false
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      TRACKDUB_ACCEPT_NVIDIA_TENSORRT_RTX_LICENSE: "${TRACKDUB_ACCEPT_NVIDIA_TENSORRT_RTX_LICENSE:-}"
    gpus: all
    init: true
    # One-shot CLI container: run workloads with `docker compose run --rm trackdub <command>`.
    # The image's default command (`doctor`) exits, so there is no long-running process to
    # restart or health-check.
    restart: "no"
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_swappiness: 0
    volumes:
      - trackdub-data:/data
      - ./docker/input:/work/input
      - trackdub-output:/work/output
      - trackdub-logs:/logs
      - trackdub-linml:/home/trackdub/.local/linml-deps
    stdin_open: true
    tty: true

volumes:
  trackdub-data:
  trackdub-logs:
  trackdub-linml:
  trackdub-output:
